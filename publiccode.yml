description:
  en:
    localisedName: jeap-project-rag
    shortDescription: A Rust-based MCP server providing RAG capabilities for understanding the jEAP codebase
    longDescription: >
      jeap-project-rag is a Rust-based Model Context Protocol (MCP) server that gives AI assistants
      Retrieval-Augmented Generation (RAG) capabilities for understanding the jEAP codebase: it creates semantic
      embeddings of code files and stores them in a local vector database for fast, targeted search. This
      repository packages the upstream open-source project-rag server (github.com/Brainwires/project-rag) for
      use within the jEAP platform.
    features:
      - Semantic search over large codebases via local vector embeddings
      - MCP server usable by AI coding assistants
